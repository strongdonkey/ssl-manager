listen_addr: ":8080"
log_level: "info"
log_file: "/var/log/ssl-manager/server.log"

# 可选：API Bearer Token 鉴权
# api_token: "your-secret-token"

etcd:
  endpoints:
    - "http://192.168.1.135:2379"
  dial_timeout: 5
  # TLS（生产必须开启）：
  # ca_cert:      "/etc/etcd/ssl/ca.pem"
  # client_cert:  "/etc/etcd/ssl/client.pem"
  # client_key:   "/etc/etcd/ssl/client-key.pem"

alert:
  expire_warn_days: 30
  webhook_url: ""     # 钉钉/企微 Webhook URL
  enable_email: false
  smtp_host: "smtp.example.com"
  smtp_port: 465
  smtp_user: ""
  smtp_password: ""
  alert_emails: []

# 渠道配置
channel:
  cert_expire_check: false          # 是否自动检查证书到期

# 钉钉通知配置
dingtalk:
  enabled: true  # 是否启用钉钉通知（默认关闭，生产环境开启）
  webhook_url: "https://oapi.dingtalk.com/robot/send?access_token=37ec916ebb399c327fadb5b037bab60589454275c4a9578fee1afee319ed39a4"
  keywords: "服务器"
  secret: ""  # 钉钉机器人密钥（可选，建议配置以增强安全性）
  at_mobiles: []  # @的手机号列表，例如: ["13800138000", "13900139000"]
  is_at_all: false  # 是否@所有人